name: Update AnyBodyCon

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-ams:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          manifest-path: pixi.toml
          activate-environment: true

      - name: Check for AnyBodyCon update
        id: check
        run: |
          pixi update anybodycon
          if (git diff --quiet pixi.toml pixi.lock) {
            echo "changed=false" >> $env:GITHUB_OUTPUT
          } else {
            echo "changed=true" >> $env:GITHUB_OUTPUT
            $version = (pixi list anybodycon --json | ConvertFrom-Json).version
            echo "version=$version" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Create update PR
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          $branch = "update-anybodycon-${{ steps.check.outputs.version }}"
          git checkout -b $branch
          git add pixi.toml pixi.lock
          git commit -m "Update AnyBodyCon to ${{ steps.check.outputs.version }}"
          git push origin $branch
          gh pr create `
            --title "Update AnyBodyCon to ${{ steps.check.outputs.version }}" `
            --body "This PR updates the `anybodycon` dependency to the latest available version.`n`nPlease review and merge if tests pass." `
            --base main `
            --head $branch
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
